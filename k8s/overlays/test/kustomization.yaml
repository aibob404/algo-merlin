apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: algo-merlin-test

resources:
  - namespace.yaml
  - ../../base

namePrefix: test-

commonLabels:
  env: test

patches:
  - path: patches/resources-reduced.yaml
  - path: patches/ingress-host.yaml

images:
  - name: ghcr.io/aibob404/algo-merlin-platform
    newTag: latest
  - name: ghcr.io/aibob404/algo-merlin-ai
    newTag: latest
  - name: ghcr.io/aibob404/algo-merlin-ui
    newTag: latest
