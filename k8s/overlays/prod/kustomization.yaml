apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: algo-merlin-prod

resources:
  - namespace.yaml
  - ../../base

namePrefix: prod-

commonLabels:
  env: prod

patches:
  - path: patches/ai-service-replicas.yaml
  - path: patches/ingress-host.yaml

images:
  - name: ghcr.io/aibob404/algo-merlin-platform
    newTag: stable
  - name: ghcr.io/aibob404/algo-merlin-ai
    newTag: stable
  - name: ghcr.io/aibob404/algo-merlin-ui
    newTag: stable
