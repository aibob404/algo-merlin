apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui-ingress
spec:
  tls:
    - hosts:
        - yourdomain.com      # TODO: replace with your domain
      secretName: ui-tls-prod
  rules:
    - host: yourdomain.com    # TODO: replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: platform
                port:
                  number: 8080
